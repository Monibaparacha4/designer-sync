# ─────────────────────────────────────────────────────────────
#  Pakistani Designer Edit – designer catalogue sync settings
#  Edit this file on GitHub; the next hourly run picks it up.
# ─────────────────────────────────────────────────────────────

pricing:
  markup_percent: 30          # added on top of the converted source price
  fixed_add: 0                # flat amount (in YOUR store currency) added after markup, e.g. shipping
  rounding: "99"              # "99" -> 129.99 | "whole" -> 130 | "none" -> 129.37
  # Optional manual FX overrides (source -> your store currency). Leave empty to use live rates.
  # fixed_rates: { PKR: 0.0028, USD: 0.79 }
  fixed_rates: {}

selection:
  products_per_brand: 150     # newest in-stock RTW items kept per brand
  pages_to_scan: 2            # pages of 250 newest products read per brand each hour
  # Products whose title / type / tags contain any of these words are skipped (not RTW apparel)
  exclude_keywords:
    - unstitched
    - un-stitched
    - unstiched
    - fabric
    - yardage
    - fragrance
    - perfume
    - attar
    - cosmetic
    - makeup
    - lipstick
    - footwear
    - shoes
    - sandal
    - slides
    - chappal
    - khussa
    - heels
    - bag
    - clutch
    - wallet
    - jewel
    - jewellery
    - jewelry
    - earring
    - bangle
    - gift card
    - giftcard
    - home
    - bedding
    - bedsheet
    - cushion
    - towel
    - mask
    - cap
    - socks

shopify:
  stock_qty_when_available: 5   # stock shown for an available size
  draft_when_sold_out: true     # hide a product when every size is sold out at the brand
  publish_to_online_store: true
  max_new_per_run: 400          # spreads the first big import over several hourly runs
  run_time_budget_minutes: 45
  extra_tags: ["designer-sync"]

